<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torn City - Bar Monitor & Alarmes</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #121212;
      color: #e0e0e0;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
      color: #fff;
    }
    .card {
      background: #1e1e1e;
      padding: 15px 20px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status {
      font-weight: bold;
      font-size: 1.3em;
      color: #4caf50;
      margin-top: 5px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="password"], input[type="number"] {
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    .btn-secondary {
      background: #6c757d;
    }
    .btn-secondary:hover {
      background: #5a6268;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    label {
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>Torn City - Monitor de Barras</h1>

  <!-- Configurações do Usuário -->
  <div class="card">
    <div class="input-group">
      <label for="apiKey">API Key do Torn:</label>
      <input type="password" id="apiKey" placeholder="Cole sua API Key aqui..." />
    </div>

    <div class="input-group">
      <label>Alertar quando atingir:</label>
      <div class="input-row">
        <div>
          <label for="targetEnergy">⚡ Energy:</label>
          <input type="number" id="targetEnergy" placeholder="Ex: 25" min="1" />
        </div>
        <div>
          <label for="targetNerve">👊 Nerve:</label>
          <input type="number" id="targetNerve" placeholder="Ex: 2" min="1" />
        </div>
      </div>
    </div>

    <div class="actions">
      <button onclick="saveSettings()" style="flex: 1;">Salvar Configurações</button>
      <button onclick="clearSettings()" class="btn-secondary">Limpar</button>
    </div>

    <button onclick="requestNotificationPermission()" class="btn-secondary" style="width: 100%; margin-top: 10px;">
      🔔 Ativar Notificações do Navegador
    </button>
  </div>

  <button onclick="fetchBars()" style="width: 100%; margin-bottom: 20px;">⚡ Atualizar Dados Agora</button>

  <!-- Dashboard de Barras -->
  <div id="dashboard">
    <div class="card">
      <div class="card-header">
        <h3>⚡ Energy</h3>
        <span id="energy-val">- / -</span>
      </div>
      <div id="energy-timer" class="status">--:--:--</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>👊 Nerve</h3>
        <span id="nerve-val">- / -</span>
      </div>
      <div id="nerve-timer" class="status">--:--:--</div>
    </div>
  </div>

  <script>
    let energyInterval, nerveInterval;

    // --- CARREGAMENTO INICIAL ---
    window.onload = () => {
      const savedKey = localStorage.getItem('torn_api_key');
      const savedEnergy = localStorage.getItem('torn_target_energy');
      const savedNerve = localStorage.getItem('torn_target_nerve');

      if (savedKey) document.getElementById('apiKey').value = savedKey;
      if (savedEnergy) document.getElementById('targetEnergy').value = savedEnergy;
      if (savedNerve) document.getElementById('targetNerve').value = savedNerve;

      if (savedKey) fetchBars();
    };

    // --- MANIPULAÇÃO DO LOCALSTORAGE ---
    function saveSettings() {
      const key = document.getElementById('apiKey').value.trim();
      const energy = document.getElementById('targetEnergy').value;
      const nerve = document.getElementById('targetNerve').value;

      if (!key) {
        alert('Por favor, digite uma API Key válida.');
        return;
      }

      localStorage.setItem('torn_api_key', key);
      if (energy) localStorage.setItem('torn_target_energy', energy);
      else localStorage.removeItem('torn_target_energy');

      if (nerve) localStorage.setItem('torn_target_nerve', nerve);
      else localStorage.removeItem('torn_target_nerve');

      alert('Configurações salvas com sucesso!');
      fetchBars();
    }

    function clearSettings() {
      localStorage.removeItem('torn_api_key');
      localStorage.removeItem('torn_target_energy');
      localStorage.removeItem('torn_target_nerve');

      document.getElementById('apiKey').value = '';
      document.getElementById('targetEnergy').value = '';
      document.getElementById('targetNerve').value = '';
      alert('Configurações removidas!');
    }

    // --- NOTIFICAÇÕES & ALARMES ---
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Este navegador não suporta notificações de trabalho.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('Notificações ativadas com sucesso!');
        } else {
          alert('Permissão de notificação negada.');
        }
      });
    }

    function sendAlert(title, message) {
      playBeep();

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
          body: message,
          icon: 'https://www.torn.com/favicon.ico'
        });
      } else {
        alert(`${title}: ${message}`);
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Erro ao tocar áudio automático:', e);
      }
    }

    // --- TEMPORIZADOR E CÁLCULO ---
    function formatTime(seconds) {
      if (seconds <= 0) return "ALVO ATINGIDO!";
      const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function calculateSecondsToTarget(bar, targetValue) {
      const current = bar.current;
      const target = targetValue ? parseInt(targetValue, 10) : bar.maximum;

      // Se já passou ou está no alvo
      if (current >= target) return 0;

      // Quantos pontos faltam
      const needed = target - current;
      // Quantos ticks são necessários
      const ticksNeeded = Math.ceil(needed / bar.increment);

      // Tempo total = (ticks restantes - 1) * intervalo + tempo até o próximo tick
      return ((ticksNeeded - 1) * bar.interval) + bar.tick_time;
    }

    function startCountdown(elementId, initialSeconds, onComplete) {
      let remaining = initialSeconds;
      const element = document.getElementById(elementId);
      
      element.innerText = formatTime(remaining);

      return setInterval(() => {
        remaining--;
        element.innerText = formatTime(remaining);

        if (remaining <= 0) {
          onComplete();
        }
      }, 1000);
    }

    // --- REQUISIÇÃO À API ---
    async function fetchBars() {
      const apiKey = localStorage.getItem('torn_api_key') || document.getElementById('apiKey').value.trim();
      const targetEnergy = localStorage.getItem('torn_target_energy') || document.getElementById('targetEnergy').value;
      const targetNerve = localStorage.getItem('torn_target_nerve') || document.getElementById('targetNerve').value;

      if (!apiKey) {
        alert('Por favor, insira e salve sua API Key primeiro.');
        return;
      }

      clearInterval(energyInterval);
      clearInterval(nerveInterval);

      try {
        const response = await fetch('https://api.torn.com/v2/user/bars', {
          headers: {
            'Accept': 'application/json',
            'Authorization': `ApiKey ${apiKey}`
          }
        });

        const data = await response.json();

        if (data.error) {
          alert(`Erro na API do Torn: ${data.error.error || 'Chave inválida'}`);
          return;
        }

        const bars = data.bars;

        // --- ENERGY ---
        document.getElementById('energy-val').innerText = `${bars.energy.current} / ${bars.energy.maximum}`;
        const energyTime = calculateSecondsToTarget(bars.energy, targetEnergy);
        const energyGoalText = targetEnergy ? targetEnergy : 'máximo';

        if (energyTime > 0) {
          energyInterval = startCountdown('energy-timer', energyTime, () => {
            clearInterval(energyInterval);
            sendAlert('⚡ Energy Pronta!', `Sua Energy atingiu a meta configurada (${energyGoalText})!`);
          });
        } else {
          document.getElementById('energy-timer').innerText = "ALVO ATINGIDO!";
        }

        // --- NERVE ---
        document.getElementById('nerve-val').innerText = `${bars.nerve.current} / ${bars.nerve.maximum}`;
        const nerveTime = calculateSecondsToTarget(bars.nerve, targetNerve);
        const nerveGoalText = targetNerve ? targetNerve : 'máximo';

        if (nerveTime > 0) {
          nerveInterval = startCountdown('nerve-timer', nerveTime, () => {
            clearInterval(nerveInterval);
            sendAlert('👊 Nerve Pronto!', `Seu Nerve atingiu a meta configurada (${nerveGoalText})!`);
          });
        } else {
          document.getElementById('nerve-timer').innerText = "ALVO ATINGIDO!";
        }

      } catch (err) {
        console.error("Erro na busca:", err);
        alert("Erro ao conectar com a API do Torn.");
      }
    }
  </script>
</body>
</html>
