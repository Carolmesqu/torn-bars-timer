<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torn City - Bar Monitor & Alarms</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Palette - Light Mode (Soft Pink & Lilac) */
    :root {
      --bg: #fff5f8;
      --card-bg: #ffffff;
      --text-main: #5b4656;
      --text-muted: #a38c9d;
      --accent-pink: #ffb7c5;
      --accent-purple: #9c84bc;
      --accent-btn: #e8a7bd;
      --btn-hover: #df93ab;
      --border-color: #f7dbe4;
      --shadow: 0 8px 24px rgba(232, 167, 189, 0.18);
      --input-bg: #fff9fc;
      --badge-bg: #e8f5e9;
      --badge-text: #2e7d32;
    }

    /* Palette - Dark Mode (Cute Night) */
    [data-theme="dark"] {
      --bg: #1f1822;
      --card-bg: #2a212e;
      --text-main: #f5eaf2;
      --text-muted: #ba9ebb;
      --accent-pink: #e295aa;
      --accent-purple: #c5a9d8;
      --accent-btn: #b07289;
      --btn-hover: #9c6076;
      --border-color: #3d2f43;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      --input-bg: #241c27;
      --badge-bg: #1b382b;
      --badge-text: #81c784;
    }

    body {
      font-family: 'Quicksand', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      padding: 32px 20px;
      max-width: 440px;
      margin: 0 auto;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0;
      letter-spacing: -0.3px;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
    }

    .card {
      background: var(--card-bg);
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header h3 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .bar-val {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .status {
      font-weight: 700;
      font-size: 1.4em;
      color: var(--accent-purple);
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    .status.done {
      display: inline-block;
      font-size: 0.85rem;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 4px 12px;
      border-radius: 12px;
      margin-top: 10px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .input-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-row > div {
      flex: 1;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input[type="password"], 
    input[type="number"] {
      padding: 10px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
      border-radius: 14px;
      font-size: 0.95rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input[type="password"]:focus, 
    input[type="number"]:focus {
      border-color: var(--accent-btn);
    }

    button {
      padding: 12px 16px;
      background: var(--accent-btn);
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      background: var(--btn-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--border-color);
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .refresh-btn {
      width: 100%;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>✨ Torn Monitor</h1>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
  </div>

  <!-- User Settings -->
  <div class="card">
    <div class="input-group">
      <label for="apiKey">Torn API Key:</label>
      <input type="password" id="apiKey" placeholder="Paste your API Key here..." />
    </div>

    <div class="input-group">
      <label>Notify me when reaching:</label>
      <div class="input-row">
        <div>
          <label for="targetEnergy">⚡ Energy:</label>
          <input type="number" id="targetEnergy" placeholder="Ex: 25" min="1" />
        </div>
        <div>
          <label for="targetNerve">👊 Nerve:</label>
          <input type="number" id="targetNerve" placeholder="Ex: 2" min="1" />
        </div>
      </div>
    </div>

    <div class="actions">
      <button onclick="saveSettings()" style="flex: 1;">Save Settings</button>
      <button onclick="clearSettings()" class="btn-secondary">Clear</button>
    </div>

    <button onclick="requestNotificationPermission()" class="btn-secondary" style="width: 100%; margin-top: 10px;">
      🔔 Enable Browser Notifications
    </button>
  </div>

  <button onclick="fetchBars()" class="refresh-btn" id="refreshBtn">⚡ Refresh Bars</button>

  <!-- Bars Dashboard -->
  <div id="dashboard">
    <div class="card">
      <div class="card-header">
        <h3>⚡ Energy</h3>
        <span id="energy-val" class="bar-val">- / -</span>
      </div>
      <div id="energy-timer" class="status">--:--:--</div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>👊 Nerve</h3>
        <span id="nerve-val" class="bar-val">- / -</span>
      </div>
      <div id="nerve-timer" class="status">--:--:--</div>
    </div>
  </div>

  <script>
    let energyInterval, nerveInterval;

    // --- THEME CONTROL (LIGHT / DARK) ---
    function initTheme() {
      const savedTheme = localStorage.getItem('torn_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButton(savedTheme);
    }
  
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('torn_theme', newTheme);
      updateThemeButton(newTheme);
    }
  
    function updateThemeButton(theme) {
      const btn = document.getElementById('themeBtn');
      if (btn) {
        btn.innerText = theme === 'dark' ? '🌸 Light Mode' : '🌙 Dark Mode';
      }
    }

    // --- INITIAL LOAD ---
    window.onload = () => {
      initTheme();

      const savedKey = localStorage.getItem('torn_api_key');
      const savedEnergy = localStorage.getItem('torn_target_energy');
      const savedNerve = localStorage.getItem('torn_target_nerve');

      if (savedKey) document.getElementById('apiKey').value = savedKey;
      if (savedEnergy) document.getElementById('targetEnergy').value = savedEnergy;
      if (savedNerve) document.getElementById('targetNerve').value = savedNerve;

      if (savedKey) fetchBars();
    };

    // --- LOCALSTORAGE HANDLER ---
    function saveSettings() {
      const key = document.getElementById('apiKey').value.trim();
      const energy = document.getElementById('targetEnergy').value;
      const nerve = document.getElementById('targetNerve').value;

      if (!key) {
        alert('Please enter a valid API Key.');
        return;
      }

      localStorage.setItem('torn_api_key', key);
      if (energy) localStorage.setItem('torn_target_energy', energy);
      else localStorage.removeItem('torn_target_energy');

      if (nerve) localStorage.setItem('torn_target_nerve', nerve);
      else localStorage.removeItem('torn_target_nerve');

      alert('Settings saved successfully!');
      fetchBars();
    }

    function clearSettings() {
      localStorage.removeItem('torn_api_key');
      localStorage.removeItem('torn_target_energy');
      localStorage.removeItem('torn_target_nerve');

      document.getElementById('apiKey').value = '';
      document.getElementById('targetEnergy').value = '';
      document.getElementById('targetNerve').value = '';
      alert('Settings cleared!');
    }

    // --- NOTIFICATIONS & ALARMS ---
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('This browser does not support desktop notifications.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('Notifications enabled successfully!');
        } else {
          alert('Notification permission denied.');
        }
      });
    }

    function sendAlert(title, message) {
      playBeep();

      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, {
          body: message,
          icon: 'https://www.torn.com/favicon.ico'
        });
      } else {
        alert(`${title}: ${message}`);
      }
    }

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      } catch (e) {
        console.log('Audio playback error:', e);
      }
    }

    // --- TIMER AND CALCULATIONS ---
    function formatTime(seconds) {
      if (seconds <= 0) return 0;
      const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function calculateSecondsToTarget(bar, targetValue) {
      const current = bar.current;
      const target = targetValue ? parseInt(targetValue, 10) : bar.maximum;

      if (current >= target) return 0;

      const needed = target - current;
      const ticksNeeded = Math.ceil(needed / bar.increment);

      return ((ticksNeeded - 1) * bar.interval) + bar.tick_time;
    }

    function startCountdown(elementId, initialSeconds, onComplete) {
      const element = document.getElementById(elementId);
      element.classList.remove('done');

      // TIMESTAMP FIX: Calcula a hora exata em milissegundos na qual o temporizador DEVE terminar
      const endTime = Date.now() + (initialSeconds * 1000);

      const updateTimer = () => {
        // Quantos segundos realmente faltam até essa hora final
        const remaining = Math.round((endTime - Date.now()) / 1000);

        if (remaining <= 0) {
          element.innerText = 'TARGET REACHED!';
          element.classList.add('done');
          onComplete();
          return true; // Finalizado
        } else {
          element.innerText = formatTime(remaining);
          return false; // Em andamento
        }
      };

      // Executa a primeira verificação no momento do disparo
      if (updateTimer()) return null;

      const intervalId = setInterval(() => {
        if (updateTimer()) {
          clearInterval(intervalId);
        }
      }, 1000);

      return intervalId;
    }

    // --- API FETCH ---
    async function fetchBars() {
      const apiKey = localStorage.getItem('torn_api_key') || document.getElementById('apiKey').value.trim();
      const targetEnergy = localStorage.getItem('torn_target_energy') || document.getElementById('targetEnergy').value;
      const targetNerve = localStorage.getItem('torn_target_nerve') || document.getElementById('targetNerve').value;

      if (!apiKey) {
        alert('Please enter and save your API Key first.');
        return;
      }

      const refreshBtn = document.getElementById('refreshBtn');
      refreshBtn.innerText = 'Refreshing...';

      if (energyInterval) clearInterval(energyInterval);
      if (nerveInterval) clearInterval(nerveInterval);

      try {
        const response = await fetch('https://api.torn.com/v2/user/bars', {
          headers: {
            'Accept': 'application/json',
            'Authorization': `ApiKey ${apiKey}`
          }
        });

        const data = await response.json();

        if (data.error) {
          alert(`Torn API Error: ${data.error.error || 'Invalid API Key'}`);
          refreshBtn.innerText = '⚡ Refresh Bars';
          return;
        }

        const bars = data.bars;

        // --- ENERGY ---
        document.getElementById('energy-val').innerText = `${bars.energy.current} / ${bars.energy.maximum}`;
        const energyTime = calculateSecondsToTarget(bars.energy, targetEnergy);
        const energyGoalText = targetEnergy ? targetEnergy : 'max';

        const energyElem = document.getElementById('energy-timer');
        if (energyTime > 0) {
          energyInterval = startCountdown('energy-timer', energyTime, () => {
            if (energyInterval) clearInterval(energyInterval);
            sendAlert('⚡ Energy Ready!', `Your Energy reached your target (${energyGoalText})!`);
          });
        } else {
          energyElem.innerText = 'TARGET REACHED!';
          energyElem.classList.add('done');
        }

        // --- NERVE ---
        document.getElementById('nerve-val').innerText = `${bars.nerve.current} / ${bars.nerve.maximum}`;
        const nerveTime = calculateSecondsToTarget(bars.nerve, targetNerve);
        const nerveGoalText = targetNerve ? targetNerve : 'max';

        const nerveElem = document.getElementById('nerve-timer');
        if (nerveTime > 0) {
          nerveInterval = startCountdown('nerve-timer', nerveTime, () => {
            if (nerveInterval) clearInterval(nerveInterval);
            sendAlert('👊 Nerve Ready!', `Your Nerve reached your target (${nerveGoalText})!`);
          });
        } else {
          nerveElem.innerText = 'TARGET REACHED!';
          nerveElem.classList.add('done');
        }

      } catch (err) {
        console.error("Fetch error:", err);
        alert("Failed to connect to Torn API.");
      } finally {
        refreshBtn.innerText = '⚡ Refresh Bars';
      }
    }
  </script>
</body>
</html>
